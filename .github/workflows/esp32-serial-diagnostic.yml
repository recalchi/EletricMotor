name: ESP32 Serial Diagnostic (Android)
on:
  push:
    branches: [main]
    paths: ['ESP32-Serial-Diagnostic/**', '.github/workflows/esp32-serial-diagnostic.yml']
  pull_request:
    paths: ['ESP32-Serial-Diagnostic/**', '.github/workflows/esp32-serial-diagnostic.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ESP32-Serial-Diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-serial-diagnostic-debug
          path: |
            ESP32-Serial-Diagnostic/app/build/outputs/apk/debug/app-debug.apk
            ESP32-Serial-Diagnostic/app-debug.apk.sha256
            ESP32-Serial-Diagnostic/app/build/reports/tests/
            ESP32-Serial-Diagnostic/app/build/reports/lint-results-debug.html
